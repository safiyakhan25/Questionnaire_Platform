databaseChangeLog:
  - changeSet:
      id: 008-create-questionnaire-session-table
      author: safiya
      comment: QUESTIONNAIRE_SESSION = one interview attempt. This is the Save & Resume anchor. previous_template_id/previous_workflow_id track where the session currently is, so a resume can pick up exactly where it left off.

      changes:
        - createTable:
            tableName: questionnaire_session
            columns:
              - column:
                  name: session_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_questionnaire_session
                    nullable: false

              - column:
                  name: person_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_questionnaire_session_person
                    references: person(id)

              - column:
                  name: status
                  type: session_status
                  defaultValue: IN_PROGRESS
                  constraints:
                    nullable: false

              - column:
                  name: previous_template_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_questionnaire_session_previous_template
                    references: template(id)

              - column:
                  name: previous_workflow_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_questionnaire_session_previous_workflow
                    references: workflow(id)

              - column:
                  name: started_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_questionnaire_session_person_id
            tableName: questionnaire_session
            columns:
              - column:
                  name: person_id

      rollback:
        - dropTable:
            tableName: questionnaire_session
