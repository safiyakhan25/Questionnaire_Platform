databaseChangeLog:
  - changeSet:
      id: 010-create-disease-table
      author: safiya
      comment: DISEASE = a diagnosis, belonging to exactly one of PERSON / FAMILY_MEMBER (enforced by the CHECK constraint below - never both, never neither).

      changes:
        - createTable:
            tableName: disease
            columns:
              - column:
                  name: disease_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_disease
                    nullable: false

              - column:
                  name: person_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_disease_person
                    references: person(id)

              - column:
                  name: family_member_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_disease_family_member
                    references: family_member(id)

              - column:
                  name: disease_type
                  type: VARCHAR

              - column:
                  name: age_at_diagnosis
                  type: INTEGER

        - sql:
            sql: |
              ALTER TABLE disease
              ADD CONSTRAINT chk_disease_owner_xor
              CHECK (
                (person_id IS NOT NULL AND family_member_id IS NULL) OR
                (person_id IS NULL AND family_member_id IS NOT NULL)
              );

        - createIndex:
            indexName: idx_disease_person_id
            tableName: disease
            columns:
              - column:
                  name: person_id

        - createIndex:
            indexName: idx_disease_family_member_id
            tableName: disease
            columns:
              - column:
                  name: family_member_id

      rollback:
        - dropTable:
            tableName: disease
