databaseChangeLog:
  - changeSet:
      id: 011-create-mutation-table
      author: safiya
      comment: MUTATION = a genetic finding, same "exactly one owner" shape as DISEASE.

      changes:
        - createTable:
            tableName: mutation
            columns:
              - column:
                  name: mutation_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_mutation
                    nullable: false

              - column:
                  name: person_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_mutation_person
                    references: person(id)

              - column:
                  name: family_member_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_mutation_family_member
                    references: family_member(id)

              - column:
                  name: gene
                  type: VARCHAR

              - column:
                  name: mutation
                  type: VARCHAR

        - sql:
            sql: |
              ALTER TABLE mutation
              ADD CONSTRAINT chk_mutation_owner_xor
              CHECK (
                (person_id IS NOT NULL AND family_member_id IS NULL) OR
                (person_id IS NULL AND family_member_id IS NOT NULL)
              );

        - createIndex:
            indexName: idx_mutation_person_id
            tableName: mutation
            columns:
              - column:
                  name: person_id

        - createIndex:
            indexName: idx_mutation_family_member_id
            tableName: mutation
            columns:
              - column:
                  name: family_member_id

      rollback:
        - dropTable:
            tableName: mutation
