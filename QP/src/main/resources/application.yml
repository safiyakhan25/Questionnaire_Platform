server:
  port: 8080

spring:
  application:
    name: questionnaire-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/questionnaire_platform_final
    username: questionnaire_app
    password: ${DB_PASSWORD:questionnaire_app_pw}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    liquibase: INFO